<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" /> <!-- emerald-500 -->
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" /> <!-- emerald-600 -->
    </linearGradient>
  </defs>

  <!-- Background Base (slate-950 equivalent) -->
  <rect width="512" height="512" rx="112" fill="#020617"/> 
  <!-- Subtle Emerald Glow -->
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Centered Scaled-up Skull from Lucide -->
  <!-- 24px icon into 512px box -> desired size 320px -> scale(13.3) -> offset = (512 - 320)/2 = 96 -->
  <g transform="translate(96, 96) scale(13.33)">
    <path d="m12.5 17-.5-1-.5 1h1z" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 22a1 1 0 0 0 1-1v-1a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20v1a1 1 0 0 0 1 1z" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15" cy="12" r="1.5" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="9" cy="12" r="1.5" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>